name: ci
# Runs on every pull request and every push to main. A PR does not merge unless this is green
# (turn on "Require status checks to pass" for main in GitHub branch protection).
on:
  pull_request: {}
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://jybloszaucgqlbkzquqw.supabase.co
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
      - name: Known vulnerabilities (production dependencies)
        run: npm audit --omit=dev --audit-level=critical || echo "::warning::npm audit found critical advisories, see the log"
      - name: No secrets in the browser bundle
        run: |
          if grep -rlE "NEXT_PUBLIC_[A-Z_]*(SECRET|PASSWORD|SERVICE|PRIVATE)" src pages app; then
            echo "::error::A secret is read through a NEXT_PUBLIC_ variable, which ships it to every browser."; exit 1; fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Public API grants match the allowlist
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::warning::SUPABASE_ACCESS_TOKEN not set, skipping"; exit 0; fi
          node scripts/security/check-db-grants.mjs
